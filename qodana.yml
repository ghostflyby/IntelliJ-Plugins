# Qodana configuration:
# https://www.jetbrains.com/help/qodana/qodana-yaml.html

version: "1.0"
projectJDK: "21"
linter: qodana-jvm-community
withinDocker: "false"
profile:
  path: .idea/inspectionProfiles/Project_Default.xml
  inspections:
    - group: ALL
      ignore:
        - "scope#$gitignore"
plugins:
  - id: DevKit
  # QDJVM Community does not load these by default, so PluginXmlValidity cannot
  # resolve language="Markdown"/"yaml" in plugin.xml (Radmir Baembitov).
  - id: org.intellij.plugins.markdown
  - id: org.jetbrains.plugins.yaml
exclude:
  - name: All
    paths:
      - plugins/IdeaVimToggleIME
