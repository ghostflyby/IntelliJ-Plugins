# Qodana configuration:
# https://www.jetbrains.com/help/qodana/qodana-yaml.html

version: "1.0"
projectJDK: "21"
linter: qodana-jvm-community
withinDocker: "false"
profile:
  path: .idea/inspectionProfiles/Project_Default.xml
  inspections:
    - group: ALL
      ignore:
        - "scope#$gitignore"
        - "scope#$spi" # META-INF/services SPI files: batch analysis cannot resolve the provider/interface references (annotator-level false positives)
plugins:
  - id: DevKit
exclude:
  - name: All
    paths:
      - plugins/IdeaVimToggleIME
  # The Kotlin plugin EPs (psiReferenceProvider, supportsKotlinPluginMode) are not
  # resolvable in the qodana batch analysis, so every attribute of these registrations
  # is flagged as "not allowed here" by the XML highlighting annotator. The IDE
  # resolves them fine; DevKit PluginXmlValidity still runs on these files.
  - name: XmlHighlighting
    paths:
      - plugins/GradleTypesafeConventions/src/main/resources/META-INF/plugin.xml
      - plugins/GradleTypesafeConventions/src/main/resources/META-INF/gradle-typesafe-conventions-kotlin-k2.xml