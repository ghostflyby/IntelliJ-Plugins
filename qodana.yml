# Qodana configuration:
# https://www.jetbrains.com/help/qodana/qodana-yaml.html

version: "1.0"
projectJDK: "21"
linter: qodana-jvm-community
withinDocker: "false"
profile:
  path: .idea/inspectionProfiles/Project_Default.xml
  inspections:
    - group: ALL
      ignore:
        - "scope#$gitignore"
plugins:
  - id: DevKit
  # QDJVM Community does not load these by default, so PluginXmlValidity cannot
  # resolve language="Markdown"/"yaml" in plugin.xml (Radmir Baembitov).
  - id: org.intellij.plugins.markdown
  - id: org.jetbrains.plugins.yaml
exclude:
  - name: All
    paths:
      - plugins/IdeaVimToggleIME
  # SplitModeModuleKindResolver looks the content-module descriptor up by the IDEA module name
  # (IntelliJ-Plugins.plugins.WorkspaceMcpTools.backend.xml) and silently falls back to the
  # "shared" kind when that file is missing, so backend-API uses in this repo are reported as
  # "should be used in 'backend' module type. Actual module type is 'shared'". Runtime descriptor
  # names must equal the module ids instead (dev.ghostflyby.mcp.workspace.*.xml). Remove when
  # IJPL-247655 lands.
  - name: SplitModeApiUsage
    paths:
      - plugins/WorkspaceMcpTools
  # Gradle-derived module dependencies are structurally misreported here: test source sets
  # inherit every implementation() dependency (test sources rarely reference them, and removing
  # the inherited dependency is impossible without removing the production one), and
  # pluginModule/pluginComposedModule declarations are packaging directives whose jars must ship
  # in the sandbox even when the main sources never import them. The build scripts are the source
  # of truth. Revisit when the inspection understands the IPG plugin-module model.
  - name: UnnecessaryModuleDependencyInspection
  # Same false-positive family as the three alerts already dismissed as false positive
  # (LiveTemplatesWithSelection, macOSRecents, EnhancedHotSwapEnabler): these personal plugins do
  # not maintain pluginIcon.svg assets.
  - name: PluginXmlPluginLogo
  # SplitModeModuleKindResolver attributes the embedded backend content module's dependencies to
  # the root descriptor, so the plugin looks implicitly backend-only. At runtime the backend
  # module is required-if-available="intellij.platform.backend", which lets the root and the
  # frontend content module keep loading in the JetBrains Client; the suggested quick fix (a
  # root-level backend dependency) would actually break that dual-side loading. Remove when the
  # resolver understands required-if-available content modules.
  - name: SplitModeImplicitModuleKind
    paths:
      - plugins/WorkspaceMcpTools
