name: Build
on:
  push:
    branches: [ main ]
  pull_request:

defaults:
  run:
    shell: pwsh

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and Check
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Configure IntelliJ Platform IDE Cache
        shell: bash
        run: |
          set -euo pipefail
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          ide_cache="$HOME/.cache/JetBrains/IJPL-Gradle/IDEs"
          mkdir -p "$gradle_user_home" "$ide_cache"
          {
            printf '\n'
            printf '%s\n' 'org.jetbrains.intellij.platform.intellijPlatformIdesCacheEnabled=true'
            printf 'org.jetbrains.intellij.platform.intellijPlatformIdesCache=%s\n' "$ide_cache"
          } >> "$gradle_user_home/gradle.properties"
      - name: Restore IntelliJ Platform IDE Cache
        id: restore-intellij-platform-ides
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/JetBrains/IJPL-Gradle/IDEs
          key: ijpl-ides-v2-${{ runner.os }}-${{ runner.arch }}-lookup-${{ github.run_id }}
          restore-keys: |
            ijpl-ides-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Run Checks
        run: |
          $gradlew = if ($IsWindows)
          {
              ".\gradlew.bat"
          }
          else
          {
              "./gradlew"
          }
          & $gradlew --configuration-cache check
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/**/build/reports/tests
      - name: Collect Code Coverage Reports
        id: coverage
        run: |
          $reports = Get-ChildItem `
            -Path (Join-Path $env:GITHUB_WORKSPACE "plugins/*/build/reports/kover/report.xml") `
            -File `
            -ErrorAction SilentlyContinue
          if (-not $reports)
          {
              exit 0
          }
          "files=$( $reports.FullName -join ',' )" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload Code Coverage Report
        if: ${{ steps.coverage.outputs.files != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: ${{ steps.coverage.outputs.files }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Select Plugin Verification tasks
        id: plugin-verification
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $verificationIdes = "recommended"
          [string[]]$verificationTasks = @("verifyPlugin")

          if ($env:EVENT_NAME -eq "pull_request")
          {
              $verificationIdes = "platform"
              [string[]]$changedFiles = @(git diff --name-only --no-renames $env:BASE_SHA $env:HEAD_SHA)
              $diffExitCode = $LASTEXITCODE

              if ($diffExitCode -eq 0 -and $changedFiles.Count -gt 0)
              {
                  $excludedPluginsPath = Join-Path $env:GITHUB_WORKSPACE ".ci/excluded-plugins.txt"
                  [string[]]$excludedPlugins = if (Test-Path -LiteralPath $excludedPluginsPath -PathType Leaf)
                  {
                      @(Get-Content -LiteralPath $excludedPluginsPath |
                              ForEach-Object { $_.Trim() } |
                              Where-Object { $_ -and -not $_.StartsWith("#") })
                  }
                  else
                  {
                      @()
                  }

                  $allChangesMapToPlugins = $true
                  [string[]]$plugins = @()
                  foreach ($changedFile in $changedFiles)
                  {
                      $normalizedPath = $changedFile.Replace("\", "/")
                      if ($normalizedPath -notmatch "^plugins/([^/]+)/")
                      {
                          $allChangesMapToPlugins = $false
                          break
                      }

                      $pluginName = $Matches[1]
                      $pluginBuildFile = Join-Path $env:GITHUB_WORKSPACE "plugins/$pluginName/build.gradle.kts"
                      if (-not (Test-Path -LiteralPath $pluginBuildFile -PathType Leaf) -or
                              $excludedPlugins -contains $pluginName)
                      {
                          $allChangesMapToPlugins = $false
                          break
                      }

                      $plugins += $pluginName
                  }

                  if ($allChangesMapToPlugins -and $plugins.Count -gt 0)
                  {
                      [string[]]$verificationTasks = @($plugins |
                              Sort-Object -Unique |
                              ForEach-Object { ":plugins:${_}:verifyPlugin" })
                  }
              }
              elseif ($diffExitCode -ne 0)
              {
                  Write-Warning "Unable to determine changed files; falling back to all Plugin Verifier tasks."
                  $global:LASTEXITCODE = 0
              }
          }

          $tasksJson = ConvertTo-Json -InputObject ([string[]]$verificationTasks) -Compress
          "tasks=$tasksJson" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ides=$verificationIdes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Plugin verification tasks: $( $verificationTasks -join ', ' )"
          Write-Host "Plugin verification IDE selection: $verificationIdes"
      - name: Run Plugin Verification tasks
        env:
          PLUGIN_VERIFICATION_TASKS: ${{ steps.plugin-verification.outputs.tasks }}
          PLUGIN_VERIFICATION_IDES: ${{ steps.plugin-verification.outputs.ides }}
        run: |
          $gradlew = if ($IsWindows)
          {
              ".\gradlew.bat"
          }
          else
          {
              "./gradlew"
          }
          [string[]]$verificationTasks = @($env:PLUGIN_VERIFICATION_TASKS | ConvertFrom-Json)
          [string[]]$gradleArguments = @("--configuration-cache")
          if ($env:PLUGIN_VERIFICATION_IDES -eq "platform")
          {
              $gradleArguments += "-PpluginVerificationIdes=platform"
          }
          $gradleArguments += $verificationTasks
          & $gradlew @gradleArguments
      - name: Upload plugin distributions
        if: ${{ always() && hashFiles('plugins/*/build/distributions/*.zip') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distributions
          path: ${{ github.workspace }}/plugins/*/build/distributions/*.zip
          if-no-files-found: error
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/plugins/*/build/reports/pluginVerifier
      - name: Plugin Verifier Summary
        env:
          reports: ${{ github.workspace }}/plugins/*/build/reports/pluginVerifier
        run: |
          Get-ChildItem -Path $env:reports -Filter "*.md" -Recurse -File |
                  Get-Content |
                  Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Report disk space
        if: ${{ always() }}
        shell: bash
        run: df -h /
  

  inspectCode:
    name: Inspect code
    uses: ./.github/workflows/inspect-code.yml
    permissions:
      contents: write
      security-events: write
      checks: write
      pull-requests: write
    secrets:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}



  releaseDraft:
    name: Release draft
    if: github.event_name == 'push'
    needs: [ build-and-check, inspectCode ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Create release drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $gradlew = if ($IsWindows)
          {
              ".\gradlew.bat"
          }
          else
          {
              "./gradlew"
          }
          $pluginPaths = & $gradlew tasks --all --console=plain -q |
                  ForEach-Object {
                      if ($_ -match "^(plugins:[^:]+):getChangelog")
                      {
                          ":$( $Matches[1] )"
                      }
                  } |
                  Sort-Object -Unique

          foreach ($pluginPath in $pluginPaths)
          {
              $tagPrefix = ($pluginPath -split ":")[-1]
              $properties = & $gradlew --configuration-cache "${pluginPath}:properties" --console=plain -q
              $versionLine = $properties | Where-Object { $_ -like "version:*" } | Select-Object -First 1
              $version = $versionLine.Substring("version:".Length).Trim()
              $changelog = (& $gradlew --configuration-cache "${pluginPath}:getChangelog" --unreleased --no-header --no-empty-sections --console=plain -q) -join [Environment]::NewLine
              
              $releaseIds = gh api "repos/{owner}/{repo}/releases" `
              --jq ".[] | select(.draft == true and (.tag_name | startswith(`"$tagPrefix-v`"))) | .id"
              foreach ($releaseId in $releaseIds)
              {
                  if ($releaseId)
                  {
                      gh api -X DELETE "repos/{owner}/{repo}/releases/$releaseId"
                  }
              }

              gh release create "$tagPrefix-v$version" `
                      --draft `
                      --title "$tagPrefix v$version" `
                      --notes "$changelog"
          }
