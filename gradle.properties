org.gradle.jvmargs=-Xmx2048m
# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html
pluginGroup=dev.ghostflyby.intellij
pluginRepositoryUrl=https://github.com/ghostflyby/IntelliJ-Plugins
# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild=261
# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
platformVersion=2026.1
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# IntelliJ Platform Gradle Plugin 2.19 adds the IDE's bundled plugins (from product-info.json) to test
# classpaths by default. That puts platform-ijent-impl on the classpath, whose descriptor declares a
# testServiceImplementation (TestIjentExecFileProvider) missing from the 2026.1 distribution, so the WSL
# tests fail with ClassNotFoundException; it also adds IDE module jars (e.g. lib/nio-fs.jar) that were not
# on the test classpath before. Re-enable once the plugin ships that class or the tests stop depending on
# the affected code paths.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathEnabled=false
# Composite build: tell the MCP SDK fork to skip heavy subprojects (docs, etc.)
mcp.sdk.composite=true
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
org.gradle.parallel=true
